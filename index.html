<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Mind Twister</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="animTitle">
        Animals Quiz
    </div> 
    
    <div class="interface">
        <!-- progress bar -->
        <div class="progressBar">
            <div class="fill" id="fill"></div>
        </div>

        <!-- question label -->
        <div class="question" id="question">
            Press Start To Begin!
        </div>
        <!-- option buttons -->
        <div class="optionBox" id="optionBox"></div>
        <!-- score and feedback labels -->
        <div class="scoreLabel" id="scoreLabel"> Score: 0 </div>
        <div class="feedbackLabel" id="feedbackLabel"> No feedback yet... </div>

        <!-- start button -->
        <button class="btn" id="btn">
            START
        </button>

        <!-- timer -->
        <div class="timer" id="timer">
            <span> 17 </span>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
